name: Android-APK

# Baut die Android-App aus der PWA (index.html) per Capacitor.
#  - Push auf main  -> Test + APK als Download-Artefakt (kein Release)
#  - Tag v*         -> signierte APK + GitHub-Release (öffentlicher Download-Link)
#  - Manuell        -> "Run workflow", optional mit Release
# Ohne Keystore-Secrets entsteht eine Debug-APK zum Testen (nicht für Verteilung).

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:
    inputs:
      release:
        description: 'GitHub-Release mit der APK anlegen'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      APP_ID: ${{ vars.APP_ID || 'de.sckr.fahrtenbuch' }}
      EXPECTED_CERT_SHA256: ${{ vars.EXPECTED_CERT_SHA256 }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Abhängigkeiten
        run: npm ci --no-audit --no-fund

      - name: Tests (GPS-Brücke)
        run: npm test

      - name: Version festlegen
        run: |
          BASE=$(node -p "require('./package.json').version")
          CODE=$((100 + GITHUB_RUN_NUMBER))
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF_NAME#v}"; else NAME="$BASE.$GITHUB_RUN_NUMBER"; fi
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Version $NAME (Code $CODE), App-ID $APP_ID"

      - name: Keystore bereitstellen
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
          echo "ANDROID_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Android-Projekt erzeugen
        run: npm run android:prepare

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            SRC=app/build/outputs/apk/release/app-release.apk
            OUT="SCKR-Fahrtenbuch-v${VERSION_NAME}.apk"
          else
            echo "::warning::Keine Keystore-Secrets gesetzt – baue Debug-APK (nur zum Testen, nicht verteilen)."
            ./gradlew assembleDebug --no-daemon --stacktrace
            SRC=app/build/outputs/apk/debug/app-debug.apk
            OUT="SCKR-Fahrtenbuch-v${VERSION_NAME}-DEBUG.apk"
          fi
          test -f "$SRC" || { echo "::error::APK nicht gefunden: $SRC"; ls -R app/build/outputs/apk || true; exit 1; }
          cp "$SRC" "$GITHUB_WORKSPACE/$OUT"
          echo "APK_FILE=$OUT" >> "$GITHUB_ENV"

      - name: Signatur prüfen
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK_FILE" | tee certs.txt
          SHA=$(grep -m1 'SHA-256 digest' certs.txt | awk -F': ' '{print $2}' | tr -d ' :' | tr 'A-F' 'a-f')
          echo "### APK: $APK_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: $VERSION_NAME (Code $VERSION_CODE), App-ID: $APP_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Zertifikat SHA-256: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$HAS_KEYSTORE" = "true" ] && [ -n "$EXPECTED_CERT_SHA256" ]; then
            WANT=$(echo "$EXPECTED_CERT_SHA256" | tr -d ' :' | tr 'A-F' 'a-f')
            if [ "$SHA" != "$WANT" ]; then
              echo "::error::Falscher Schlüssel! Zertifikat $SHA passt nicht zu EXPECTED_CERT_SHA256. Updates würden auf Handys scheitern."
              exit 1
            fi
            echo "- ✅ Zertifikat stimmt mit EXPECTED_CERT_SHA256 überein" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keystore entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE }}
          path: ${{ env.APK_FILE }}
          retention-days: 30

      - name: GitHub-Release
        if: env.HAS_KEYSTORE == 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then TAG="v${VERSION_NAME}"; fi
          cp "$APK_FILE" SCKR-Fahrtenbuch.apk   # fester Name -> Dauerlink .../releases/latest/download/SCKR-Fahrtenbuch.apk
          gh release create "$TAG" "$APK_FILE" SCKR-Fahrtenbuch.apk \
            --target "$GITHUB_SHA" \
            --title "SCKR Fahrtenbuch $VERSION_NAME" \
            --notes "Android-APK zum direkten Installieren (außerhalb des Play Stores). Bei bestehender Installation einfach drüberinstallieren – Fahrten bleiben erhalten."
          echo "- Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dauerlink für den Verein: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest/download/SCKR-Fahrtenbuch.apk" >> "$GITHUB_STEP_SUMMARY"
