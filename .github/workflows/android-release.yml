name: Android-APK

# Baut die Android-App aus der PWA (index.html) per Capacitor.
#  - Push auf main  -> Test + APK als Download-Artefakt (kein Release)
#  - Tag v*         -> signierte APK + GitHub-Release (öffentlicher Download-Link)
#  - Manuell        -> "Run workflow", optional mit Release
# Ohne Keystore-Secrets entsteht eine Debug-APK zum Testen (eigene App-ID ".debug").
# Ein Release bricht ab, wenn Secrets oder Variablen fehlen (Schutz vor falscher APK).

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:
    inputs:
      release:
        description: 'GitHub-Release mit der APK anlegen'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash   # = bash -eo pipefail
    env:
      APP_ID: ${{ vars.APP_ID || 'de.sckr.fahrtenbuch' }}
      APP_ID_SET: ${{ vars.APP_ID != '' }}
      VERSION_CODE_BASE: ${{ vars.VERSION_CODE_BASE || '100' }}
      EXPECTED_CERT_SHA256: ${{ vars.EXPECTED_CERT_SHA256 }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release == true }}
      # Öffentlicher GitHub-Release-Link (Standard: an). Für gezielte Verteilung / privates Repo: Variable PUBLIC_RELEASE=false
      PUBLIC_RELEASE: ${{ vars.PUBLIC_RELEASE || 'true' }}
      # Gezielte Verteilung per Firebase App Distribution (nur eingeladene Tester), aktiv sobald eingerichtet
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      FIREBASE_GROUPS: ${{ vars.FIREBASE_GROUPS || 'verein' }}
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && vars.FIREBASE_APP_ID != '' }}
    steps:
      - name: Release-Vorabprüfung
        if: env.IS_RELEASE == 'true'
        env:
          S1: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          S2: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          S3: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
        run: |
          MISSING=""
          [ "$S1" = "true" ] || MISSING="$MISSING Secret:ANDROID_KEYSTORE_BASE64"
          [ "$S2" = "true" ] || MISSING="$MISSING Secret:ANDROID_KEYSTORE_PASSWORD"
          [ "$S3" = "true" ] || MISSING="$MISSING Secret:ANDROID_KEY_ALIAS"
          [ "$APP_ID_SET" = "true" ] || MISSING="$MISSING Variable:APP_ID"
          [ -n "$EXPECTED_CERT_SHA256" ] || MISSING="$MISSING Variable:EXPECTED_CERT_SHA256"
          if [ -n "$MISSING" ]; then
            echo "::error::Release abgebrochen – es fehlt:$MISSING (siehe docs/ANDROID-RELEASE.md)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Abhängigkeiten
        run: npm ci --no-audit --no-fund

      - name: Tests (GPS-Brücke)
        run: npm test

      - name: Version festlegen
        run: |
          BASE=$(node -p "require('./package.json').version")
          CODE=$((VERSION_CODE_BASE + GITHUB_RUN_NUMBER))
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF_NAME#v}"; else NAME="$BASE.$GITHUB_RUN_NUMBER"; fi
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Version $NAME (Code $CODE), App-ID $APP_ID"

      - name: Keystore bereitstellen
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 -d > "$KS"
          [ -s "$KS" ] || { echo "::error::Keystore-Secret ist leer oder kein gültiges Base64"; exit 1; }
          echo "ANDROID_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Android-Projekt erzeugen
        run: npm run android:prepare

      - uses: gradle/actions/setup-gradle@v6

      - name: APK bauen
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # Maven Central drosselt geteilte GitHub-Runner gelegentlich (HTTP 429) -> bis zu 3 Versuche
          gradle_retry() { for i in 1 2 3; do ./gradlew "$@" --no-daemon --stacktrace && return 0; echo "::warning::Gradle-Versuch $i fehlgeschlagen, neuer Versuch in $((i*60)) s"; sleep $((i*60)); done; return 1; }
          if [ "$HAS_KEYSTORE" = "true" ]; then
            gradle_retry assembleRelease
            SRC=app/build/outputs/apk/release/app-release.apk
            OUT="SCKR-Fahrtenbuch-v${VERSION_NAME}.apk"
          else
            echo "::warning::Keine Keystore-Secrets gesetzt – baue Debug-APK (App-ID ${APP_ID}.debug, nur zum Testen)."
            gradle_retry assembleDebug
            SRC=app/build/outputs/apk/debug/app-debug.apk
            OUT="SCKR-Fahrtenbuch-v${VERSION_NAME}-DEBUG.apk"
          fi
          test -f "$SRC" || { echo "::error::APK nicht gefunden: $SRC"; ls -R app/build/outputs/apk || true; exit 1; }
          cp "$SRC" "$GITHUB_WORKSPACE/$OUT"
          echo "APK_FILE=$OUT" >> "$GITHUB_ENV"

      - name: Signatur prüfen
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK_FILE" > certs.txt
          cat certs.txt
          SHA=$(grep -m1 'SHA-256 digest' certs.txt | awk -F': ' '{print $2}' | tr -d ' :' | tr '[:upper:]' '[:lower:]' || true)
          [ -n "$SHA" ] || { echo "::error::Zertifikat konnte nicht gelesen werden"; exit 1; }
          {
            echo "### APK: $APK_FILE"
            echo "- Version: $VERSION_NAME (Code $VERSION_CODE), App-ID: $APP_ID"
            echo "- Zertifikat SHA-256: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$HAS_KEYSTORE" = "true" ] && [ -n "$EXPECTED_CERT_SHA256" ]; then
            WANT=$(echo "$EXPECTED_CERT_SHA256" | sed -E 's/^[[:space:]]*[Ss][Hh][Aa]-?256:?//' | tr -d ' :\r\n\t' | tr '[:upper:]' '[:lower:]')
            if [ "$SHA" != "$WANT" ]; then
              echo "::error::Falscher Schlüssel! APK-Zertifikat $SHA passt nicht zu EXPECTED_CERT_SHA256 ($WANT). Updates würden auf den Handys scheitern."
              exit 1
            fi
            echo "- ✅ Zertifikat stimmt mit EXPECTED_CERT_SHA256 überein" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keystore entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_FILE }}
          path: ${{ env.APK_FILE }}
          retention-days: 30

      - name: An Tester verteilen (Firebase App Distribution)
        if: env.IS_RELEASE == 'true' && env.HAS_KEYSTORE == 'true' && env.HAS_FIREBASE == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          SA="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA"
          npx -y firebase-tools@latest appdistribution:distribute "$APK_FILE" \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_GROUPS" \
            --release-notes "SCKR Fahrtenbuch $VERSION_NAME"
          rm -f "$SA"
          echo "- 📲 An Firebase-Testergruppe \`$FIREBASE_GROUPS\` verteilt (Einladung per E-Mail)" >> "$GITHUB_STEP_SUMMARY"

      - name: GitHub-Release
        if: env.IS_RELEASE == 'true' && env.HAS_KEYSTORE == 'true' && env.PUBLIC_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then TAG="v${VERSION_NAME}"; fi
          cp "$APK_FILE" SCKR-Fahrtenbuch.apk   # fester Name -> Dauerlink .../releases/latest/download/SCKR-Fahrtenbuch.apk
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" SCKR-Fahrtenbuch.apk --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK_FILE" SCKR-Fahrtenbuch.apk -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SCKR Fahrtenbuch $VERSION_NAME" \
              --notes "Android-APK zum direkten Installieren (außerhalb des Play Stores). Bei bestehender Installation einfach drüberinstallieren."
          fi
          {
            echo "- Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo "- Dauerlink für den Verein: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest/download/SCKR-Fahrtenbuch.apk"
          } >> "$GITHUB_STEP_SUMMARY"
